$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json

type: command
name: fraud_evaluate_component
display_name: Fraud Evaluate Component
version: 1
description: Evaluate fraud predictions produced by the training component.

inputs:
  predictions:
    type: uri_folder

code: ./

environment: azureml://registries/azureml/environments/sklearn-1.5/labels/latest

command: >-
  python evaluate.py
  --predictions ${{inputs.predictions}}